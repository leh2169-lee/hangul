<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>즐거운 한글날 계기교육</title>
    <!-- Tailwind CSS (버튼과 화면을 예쁘게 꾸며주는 도구) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 둥글고 귀여운 느낌의 폰트 (Jua) 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Jua', sans-serif; 
            background-color: #FDF5E6; /* 따뜻한 상아색 배경 */
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* 버튼을 눌렀을 때 쏙 들어가는 느낌을 주는 애니메이션 */
        .card-btn {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .card-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center p-4">
    
    <h1 class="text-6xl md:text-7xl text-blue-900 mb-10 drop-shadow-sm text-center">
        🎉 즐거운 한글날 놀이 🎉
    </h1>
    
    <!-- 2x2 바둑판 배열로 큼직한 버튼 4개 배치 -->
    <div class="grid grid-cols-2 gap-6 w-full max-w-5xl h-[60vh]">
        
        <!-- 1. 한글 꾸미기 (한글날.html) -->
        <a href="한글날.html" class="card-btn flex flex-col items-center justify-center bg-white rounded-[3rem] p-4 shadow-lg border-b-8 border-blue-200 hover:bg-blue-50 text-decoration-none">
            <span class="text-[6rem] mb-2 drop-shadow-md">🎨</span>
            <span class="text-4xl md:text-5xl text-gray-800">1. 한글 꾸미기</span>
        </a>
        
        <!-- 2. 화면 닦기 (한글날2_2.html) -->
        <a href="한글날2_2.html" class="card-btn flex flex-col items-center justify-center bg-white rounded-[3rem] p-4 shadow-lg border-b-8 border-green-200 hover:bg-green-50 text-decoration-none">
            <span class="text-[6rem] mb-2 drop-shadow-md">🧽</span>
            <span class="text-4xl md:text-5xl text-gray-800">2. 화면 닦기</span>
        </a>

        <!-- 3. 그림자 맞추기 (한글날3_2.html) -->
        <a href="한글날3_2.html" class="card-btn flex flex-col items-center justify-center bg-white rounded-[3rem] p-4 shadow-lg border-b-8 border-orange-200 hover:bg-orange-50 text-decoration-none">
            <span class="text-[6rem] mb-2 drop-shadow-md">🧩</span>
            <span class="text-4xl md:text-5xl text-gray-800">3. 짝 맞추기</span>
        </a>

        <!-- 4. 선 긋기 (한글날4_2.html) -->
        <a href="한글날4_2.html" class="card-btn flex flex-col items-center justify-center bg-white rounded-[3rem] p-4 shadow-lg border-b-8 border-pink-200 hover:bg-pink-50 text-decoration-none">
            <span class="text-[6rem] mb-2 drop-shadow-md">🖍️</span>
            <span class="text-4xl md:text-5xl text-gray-800">4. 길 찾기</span>
        </a>

    </div>

</body>
</html>
