<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>이미지 길 찾기</title>
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #FFF0F5; touch-action: none; overflow: hidden; }
  .container { width: 1000px; height: 400px; background: white; border-radius: 40px; position: relative; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
  
  .start, .end { position: absolute; top: 50%; transform: translateY(-50%); z-index: 5; text-align: center; }
  .start { left: 40px; }
  .end { right: 40px; }
  
  /* 시작/도착 이미지 크기 및 오작동 방지 */
  .start img, .end img { width: 180px; height: auto; pointer-events: none; -webkit-user-drag: none; }
  .label { font-size: 28px; font-weight: bold; color: #333; margin-top: 10px; }
  
  canvas { position: absolute; top: 0; left: 0; z-index: 10; cursor: pointer; }
  .guide-line { position: absolute; top: 50%; left: 220px; right: 220px; height: 10px; border-top: 15px dashed #eee; transform: translateY(-50%); z-index: 1; }
  
  .candy { position: absolute; font-size: 50px; font-weight: bold; user-select: none; pointer-events: none; animation: fall 2.5s linear forwards; }
  @keyframes fall { to { transform: translateY(600px) rotate(360deg); opacity: 0; } }
</style>
</head>
<body>
<div class="container" id="container">
  
  <div class="start">
    <!-- ★ 출발점 이미지 (예: 세종대왕) -->
    <img src="sejong.png" alt="세종대왕">
    <div class="label">세종대왕</div>
  </div>
  
  <div class="guide-line"></div>
  <canvas id="lineCanvas"></canvas>
  
  <div class="end">
    <!-- ★ 도착점 이미지 (예: 훈민정음 책) -->
    <img src="book.png" alt="훈민정음">
    <div class="label">훈민정음</div>
  </div>
  
</div>
<script>
  const canvas = document.getElementById('lineCanvas');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('container');
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;

  let isDrawing = false;
  let isDone = false;

  ctx.lineWidth = 40; 
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#4CAF50'; 

  function draw(e) {
    if (!isDrawing || isDone) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    ctx.lineTo(x, y);
    ctx.stroke();

    if (x > canvas.width - 250) {
      isDone = true;
      triggerReward();
    }
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (isDone) return;
    isDrawing = true;
    const rect = canvas.getBoundingClientRect();
    ctx.beginPath();
    ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
  });
  canvas.addEventListener('pointermove', draw);
  canvas.addEventListener('pointerup', () => isDrawing = false);
  canvas.addEventListener('pointerleave', () => isDrawing = false);

  function triggerReward() {
    const rewards = ['🍬', 'ㄱ', 'ㄴ', 'ㄷ', 'ㅏ', 'ㅓ', '🍬', '한', '글'];
    
    for (let i = 0; i < 40; i++) {
      setTimeout(() => {
        const candy = document.createElement('div');
        candy.className = 'candy';
        candy.innerText = rewards[Math.floor(Math.random() * rewards.length)];
        candy.style.left = Math.random() * container.clientWidth + 'px';
        candy.style.top = '-50px';
        
        const colors = ['#E74C3C', '#3498DB', '#F1C40F', '#2ECC71', '#9B59B6'];
        candy.style.color = colors[Math.floor(Math.random() * colors.length)];
        
        container.appendChild(candy);
      }, i * 80); 
    }
  }
</script>
</body>
</html>
